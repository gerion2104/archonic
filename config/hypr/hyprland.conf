source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looks.conf
source = ~/.config/hypr/autostart.conf

input {
    kb_layout = de
    follow_mouse = 1

    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ~/.local/bin in den Sitzungs-PATH. Ohne das finden Waybar-Klicks und
# Hyprland-Binds die eigenen archonic-* Befehle nicht -- die .bashrc
# wird von der grafischen Sitzung nicht gelesen.
env = PATH,$HOME/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/bin


# Kleine Werkzeugfenster schweben lassen statt kacheln
windowrule = match:class pavucontrol-qt, float on
windowrule = match:class pavucontrol-qt, size 800 550

# Kleine Werkzeugfenster schweben lassen statt kacheln
windowrule = match:class pavucontrol-qt, float on
windowrule = match:class pavucontrol-qt, size 800 550

env = QT_QPA_PLATFORMTHEME,qt6ct

# Terminals, die als Werkzeugfenster gestartet werden
windowrule = match:class floatterm, float on
windowrule = match:class floatterm, size 900 600
